name: Release app

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate app tag and versions
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^app-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta\.(?:0|[1-9][0-9]*))?)$') {
            throw "Use app-vX.Y.Z for Stable or app-vX.Y.Z-beta.N for Beta. Got: $tag"
          }
          $version = $Matches.version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -LiteralPath src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -cne $version -or $cargoVersion -cne $version) {
            throw "Tag version $version must match package.json ($packageVersion) and Cargo.toml ($cargoVersion)."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "beta=$($version.Contains('-beta.').ToString().ToLowerInvariant())"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test TypeScript
        run: npm test

      - name: Test Rust
        run: npm run test:rust -- --locked

      - name: Build portable Windows x64 exe
        run: npm run tauri -- build --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Stage Lucent.exe
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -LiteralPath src-tauri/target/x86_64-pc-windows-msvc/release/lucent.exe -Destination release/Lucent.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          $options = @('--verify-tag', '--title', "Lucent $env:APP_VERSION")
          # The notes are what docs/releases/<version>.md says above its first "## " heading, less the title:
          # the Validation and Publication sections below it are the maintainer's record, not the player's.
          # A version with no such notes gets GitHub's generated ones, which the app tidies before showing.
          $notesSource = "docs/releases/$env:APP_VERSION.md"
          $notes = ''
          if (Test-Path -LiteralPath $notesSource -PathType Leaf) {
            $head = foreach ($line in Get-Content -LiteralPath $notesSource -Encoding utf8) {
              if ($line -match '^##\s') { break }
              if ($line -notmatch '^#\s') { $line }
            }
            $notes = ($head -join "`n").Trim()
          }
          if ($notes) {
            $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM
            $options += @('--notes-file', $notesFile)
          } else {
            Write-Host "::warning::No release notes for $env:APP_VERSION in $notesSource, so GitHub generates them."
            $options += '--generate-notes'
          }
          if ($env:BETA -eq 'true') {
            $options += @('--prerelease', '--latest=false')
          } else {
            $options += '--latest'
          }
          gh release create $env:GITHUB_REF_NAME release/Lucent.exe @options
