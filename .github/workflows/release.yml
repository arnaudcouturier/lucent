name: Release app

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read # SignPath reads the uploaded build artifact.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate app tag and versions
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^app-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta\.(?:0|[1-9][0-9]*))?)$') {
            throw "Use app-vX.Y.Z for Stable or app-vX.Y.Z-beta.N for Beta. Got: $tag"
          }
          $version = $Matches.version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -LiteralPath src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -cne $version -or $cargoVersion -cne $version) {
            throw "Tag version $version must match package.json ($packageVersion) and Cargo.toml ($cargoVersion)."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "beta=$($version.Contains('-beta.').ToString().ToLowerInvariant())"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test TypeScript
        run: npm test

      - name: Test Rust
        run: npm run test:rust -- --locked

      - name: Build portable Windows x64 exe
        run: npm run tauri -- build --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Stage Lucent.exe
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -LiteralPath src-tauri/target/x86_64-pc-windows-msvc/release/lucent.exe -Destination release/Lucent.exe

      - name: Upload unsigned exe for SignPath
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lucent-unsigned
          path: release/Lucent.exe
          if-no-files-found: error

      # Leave SIGNPATH_ENABLED unset until the Foundation application in #25 is approved.
      - name: Sign Lucent.exe
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: portable-exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify and stage signed exe
        if: vars.SIGNPATH_ENABLED == 'true'
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath signed/Lucent.exe
          if ($signature.Status -ne 'Valid') {
            throw "SignPath returned an exe without a valid signature: $($signature.Status)"
          }
          Copy-Item -LiteralPath signed/Lucent.exe -Destination release/Lucent.exe -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          $options = @('--verify-tag', '--generate-notes', '--title', "Lucent $env:APP_VERSION")
          if ($env:BETA -eq 'true') {
            $options += @('--prerelease', '--latest=false')
          } else {
            $options += '--latest'
          }
          gh release create $env:GITHUB_REF_NAME release/Lucent.exe @options
