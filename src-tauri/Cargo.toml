[package]
name = "lucent"
version = "0.1.0"
description = "Windows manager that deploys DLSS 5 (OptiScaler), ReShade, shaders and presets for XIV."
license = "MIT"
edition = "2021"

[lib]
name = "lucent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
