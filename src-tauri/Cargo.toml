[package]
name = "lucent"
version = "0.1.1"
description = "Windows manager for XIV graphics mods: DLSS 5 through OptiScaler, and ReShade with shaders and presets."
license = "MIT"
edition = "2021"

[lib]
name = "lucent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_UI_WindowsAndMessaging"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
sha2 = "0.10"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
